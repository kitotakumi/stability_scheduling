<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 700 470" role="img">
<title>direct swap の動作（初期解との位置一致）</title>
<desc>上段(swap前): 初期解S₀と現在解S*で位置0が食い違う。現在解の位置0と位置2を直接swapする。下段(swap後): swap後の現在解は位置0が初期解と一致する。</desc>
<defs>
  <marker id="ds-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" class="ds-arrowhead" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .ds-title  { font-family: sans-serif; font-size: 15px; font-weight: 600; fill: #2c2c2a; }
  .ds-lbl    { font-family: sans-serif; font-size: 13px; font-weight: 500; fill: #44443f; }
  .ds-pos    { font-family: sans-serif; font-size: 12px; fill: #73726c; }
  .ds-note   { font-family: sans-serif; font-size: 12px; font-weight: 500; }
  .ds-jbox   { fill: #f0efe9; stroke: #c5c3bb; stroke-width: 0.75; }
  .ds-jtext  { font-family: sans-serif; font-size: 14px; font-weight: 600; fill: #3d3d3a; }
  .ds-gbox   { fill: #d8efe6; stroke: #1d9e75; stroke-width: 2; }
  .ds-gtext  { font-family: sans-serif; font-size: 14px; font-weight: 600; fill: #0f6e56; }
  .ds-obox   { fill: #f7e0d4; stroke: #cc6a3f; stroke-width: 2; }
  .ds-otext  { font-family: sans-serif; font-size: 14px; font-weight: 600; fill: #993c1d; }
  .ds-green  { fill: #0f6e56; }
  .ds-orange { fill: #993c1d; }
  .ds-gdash  { fill: none; stroke: #1d9e75; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ds-odash  { fill: none; stroke: #cc6a3f; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ds-swap   { fill: none; stroke: #cc6a3f; stroke-width: 2.2; }
  .ds-arrowhead { stroke: #cc6a3f; }
  .ds-div    { stroke: rgba(0,0,0,0.18); stroke-width: 0.75; stroke-dasharray: 3 3; }
  @media (prefers-color-scheme: dark) {
    .ds-title  { fill: #faf9f5; }
    .ds-lbl    { fill: #d3d1c7; }
    .ds-pos    { fill: #9c9a92; }
    .ds-jbox   { fill: #444441; stroke: #8a8880; }
    .ds-jtext  { fill: #d3d1c7; }
    .ds-gbox   { fill: #085041; stroke: #5dcaa5; }
    .ds-gtext  { fill: #9fe1cb; }
    .ds-obox   { fill: #712b13; stroke: #f0997b; }
    .ds-otext  { fill: #f5c4b3; }
    .ds-green  { fill: #5dcaa5; }
    .ds-orange { fill: #f0997b; }
    .ds-gdash  { stroke: #5dcaa5; }
    .ds-odash  { stroke: #f0997b; }
    .ds-swap   { stroke: #f0997b; }
    .ds-arrowhead { stroke: #f0997b; }
    .ds-div    { stroke: rgba(255,255,255,0.18); }
  }
</style>

<!-- ===================== 上段: swap 前 ===================== -->
<text x="40" y="26" class="ds-title">① swap 前 — 位置0 が初期解と食い違う</text>

<!-- 位置インデックス -->
<text x="40" y="54" class="ds-pos" dominant-baseline="central">位置:</text>
<text x="178" y="54" class="ds-pos" text-anchor="middle" dominant-baseline="central">0</text>
<text x="246" y="54" class="ds-pos" text-anchor="middle" dominant-baseline="central">1</text>
<text x="314" y="54" class="ds-pos" text-anchor="middle" dominant-baseline="central">2</text>
<text x="382" y="54" class="ds-pos" text-anchor="middle" dominant-baseline="central">3</text>
<text x="450" y="54" class="ds-pos" text-anchor="middle" dominant-baseline="central">4</text>

<!-- 初期解 S0 -->
<text x="40" y="88" class="ds-lbl" dominant-baseline="central">初期解 S<tspan baseline-shift="sub" font-size="10">p</tspan></text>
<g><rect x="150" y="68" width="56" height="40" rx="6" class="ds-gbox"/><text x="178" y="88" text-anchor="middle" dominant-baseline="central" class="ds-gtext">J₃</text></g>
<g><rect x="218" y="68" width="56" height="40" rx="6" class="ds-jbox"/><text x="246" y="88" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₁</text></g>
<g><rect x="286" y="68" width="56" height="40" rx="6" class="ds-jbox"/><text x="314" y="88" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₄</text></g>
<g><rect x="354" y="68" width="56" height="40" rx="6" class="ds-jbox"/><text x="382" y="88" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₂</text></g>
<g><rect x="422" y="68" width="56" height="40" rx="6" class="ds-jbox"/><text x="450" y="88" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₅</text></g>
<text x="500" y="88" class="ds-note ds-green" dominant-baseline="central">位置0 = J₃（あるべき姿）</text>

<!-- 現在解 S* -->
<text x="40" y="152" class="ds-lbl" dominant-baseline="central">現在解 S*</text>
<g><rect x="150" y="132" width="56" height="40" rx="6" class="ds-obox"/><text x="178" y="152" text-anchor="middle" dominant-baseline="central" class="ds-otext">J₁</text></g>
<g><rect x="218" y="132" width="56" height="40" rx="6" class="ds-jbox"/><text x="246" y="152" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₂</text></g>
<g><rect x="286" y="132" width="56" height="40" rx="6" class="ds-obox"/><text x="314" y="152" text-anchor="middle" dominant-baseline="central" class="ds-otext">J₃</text></g>
<g><rect x="354" y="132" width="56" height="40" rx="6" class="ds-jbox"/><text x="382" y="152" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₄</text></g>
<g><rect x="422" y="132" width="56" height="40" rx="6" class="ds-jbox"/><text x="450" y="152" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₅</text></g>
<text x="500" y="152" class="ds-note ds-orange" dominant-baseline="central">位置0 = J₁（直したい）</text>

<!-- 位置0 食い違いの枠 -->
<rect x="146" y="64" width="64" height="112" rx="8" class="ds-odash"/>

<!-- swap 矢印（現在解の 位置0 ↔ 位置2） -->
<path d="M178 176 Q246 220 314 176" class="ds-swap" marker-start="url(#ds-arrow)" marker-end="url(#ds-arrow)"/>
<text x="246" y="234" text-anchor="middle" class="ds-note ds-orange">位置0 の J₁ と 位置2 の J₃ を直接 swap（隣接していなくてよい）</text>

<!-- ===================== 区切り ===================== -->
<line x1="40" y1="262" x2="660" y2="262" class="ds-div"/>

<!-- ===================== 下段: swap 後 ===================== -->
<text x="40" y="290" class="ds-title">② swap 後 — 位置0 が初期解と一致</text>

<!-- 位置インデックス -->
<text x="40" y="318" class="ds-pos" dominant-baseline="central">位置:</text>
<text x="178" y="318" class="ds-pos" text-anchor="middle" dominant-baseline="central">0</text>
<text x="246" y="318" class="ds-pos" text-anchor="middle" dominant-baseline="central">1</text>
<text x="314" y="318" class="ds-pos" text-anchor="middle" dominant-baseline="central">2</text>
<text x="382" y="318" class="ds-pos" text-anchor="middle" dominant-baseline="central">3</text>
<text x="450" y="318" class="ds-pos" text-anchor="middle" dominant-baseline="central">4</text>

<!-- 初期解 S0（不変） -->
<text x="40" y="352" class="ds-lbl" dominant-baseline="central">初期解 S<tspan baseline-shift="sub" font-size="10">p</tspan></text>
<g><rect x="150" y="332" width="56" height="40" rx="6" class="ds-gbox"/><text x="178" y="352" text-anchor="middle" dominant-baseline="central" class="ds-gtext">J₃</text></g>
<g><rect x="218" y="332" width="56" height="40" rx="6" class="ds-jbox"/><text x="246" y="352" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₁</text></g>
<g><rect x="286" y="332" width="56" height="40" rx="6" class="ds-jbox"/><text x="314" y="352" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₄</text></g>
<g><rect x="354" y="332" width="56" height="40" rx="6" class="ds-jbox"/><text x="382" y="352" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₂</text></g>
<g><rect x="422" y="332" width="56" height="40" rx="6" class="ds-jbox"/><text x="450" y="352" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₅</text></g>

<!-- 現在解 S*（swap 後: 位置0と位置2を入替） -->
<text x="40" y="416" class="ds-lbl" dominant-baseline="central">現在解 S*′</text>
<g><rect x="150" y="396" width="56" height="40" rx="6" class="ds-gbox"/><text x="178" y="416" text-anchor="middle" dominant-baseline="central" class="ds-gtext">J₃</text></g>
<g><rect x="218" y="396" width="56" height="40" rx="6" class="ds-jbox"/><text x="246" y="416" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₂</text></g>
<g><rect x="286" y="396" width="56" height="40" rx="6" class="ds-jbox"/><text x="314" y="416" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₁</text></g>
<g><rect x="354" y="396" width="56" height="40" rx="6" class="ds-jbox"/><text x="382" y="416" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₄</text></g>
<g><rect x="422" y="396" width="56" height="40" rx="6" class="ds-jbox"/><text x="450" y="416" text-anchor="middle" dominant-baseline="central" class="ds-jtext">J₅</text></g>

<!-- 位置0 一致の枠 -->
<rect x="146" y="328" width="64" height="112" rx="8" class="ds-gdash"/>
<text x="500" y="384" class="ds-note ds-green" dominant-baseline="central">位置0 が S<tspan baseline-shift="sub" font-size="10">p</tspan> と一致 ✓</text>
</svg>
