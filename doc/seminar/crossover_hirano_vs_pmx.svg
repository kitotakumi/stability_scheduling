<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 620" role="img">
<title>memeticの交叉：hiranoとPMXのしくみと適合性</title>
<desc>operation-based符号化（重複あり順列）における2つの交叉演算子の動作比較。hiranoは窓内のオーダー組換えで常に実行可能、PMXは重複により前提が崩れる。</desc>
