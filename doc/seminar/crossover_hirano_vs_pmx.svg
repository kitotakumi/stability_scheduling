<rect class="bg" x="0" y="0" width="900" height="620"/>

<text x="32" y="34" class="title">memetic の交叉：hirano と PMX のしくみと適合性</text>
<text x="32" y="56" class="sub">operation-based 符号化（同じジョブ番号が工程数だけ繰り返す「重複あり順列」）での 2 演算子の動作比較</text>

<!-- ===== 符号化の説明 ===== -->
<g transform="translate(0,80)">
  <rect class="j0" x="95" y="0" width="32" height="28" rx="4"/><text class="gene" x="111" y="19" text-anchor="middle">0</text>
  <rect class="j0" x="132" y="0" width="32" height="28" rx="4"/><text class="gene" x="148" y="19" text-anchor="middle">0</text>
  <rect class="j0" x="169" y="0" width="32" height="28" rx="4"/><text class="gene" x="185" y="19" text-anchor="middle">0</text>
  <rect class="j1" x="206" y="0" width="32" height="28" rx="4"/><text class="gene" x="222" y="19" text-anchor="middle">1</text>
  <rect class="j1" x="243" y="0" width="32" height="28" rx="4"/><text class="gene" x="259" y="19" text-anchor="middle">1</text>
  <rect class="j1" x="280" y="0" width="32" height="28" rx="4"/><text class="gene" x="296" y="19" text-anchor="middle">1</text>
  <rect class="j2" x="317" y="0" width="32" height="28" rx="4"/><text class="gene" x="333" y="19" text-anchor="middle">2</text>
  <rect class="j2" x="354" y="0" width="32" height="28" rx="4"/><text class="gene" x="370" y="19" text-anchor="middle">2</text>
  <rect class="j2" x="391" y="0" width="32" height="28" rx="4"/><text class="gene" x="407" y="19" text-anchor="middle">2</text>
  <text class="rl" x="86" y="19" text-anchor="end">染色体</text>
  <path class="brc" d="M95 40 V44 H201 V40"/><text class="brl" x="148" y="58" text-anchor="middle">job0 の 3 工程</text>
  <path class="brc" d="M206 40 V44 H312 V40"/><text class="brl" x="259" y="58" text-anchor="middle">job1 の 3 工程</text>
  <path class="brc" d="M317 40 V44 H423 V40"/><text class="brl" x="370" y="58" text-anchor="middle">job2 の 3 工程</text>
</g>
<text class="head" x="455" y="94">符号化</text>
<text class="cap" x="455" y="114">・遺伝子＝ディスパッチ順を表すジョブ番号列。</text>
<text class="cap" x="455" y="132">・各ジョブは工程数ぶん繰り返し現れる。</text>
<text class="cap" x="455" y="150">・k 回目の出現＝そのジョブの第 k 工程。</text>
<text class="cap" x="455" y="168">・どう並べ替えても本数が保たれれば実行可能。</text>

<line class="div" x1="32" y1="190" x2="868" y2="190"/>

<!-- ===== hirano ===== -->
<text class="sec" x="32" y="216">① hirano 交叉 — 窓内オーダー組換え</text>

<g transform="translate(0,230)">
  <rect class="win" x="166" y="-3" width="149" height="34" rx="5"/>
  <rect class="j0" x="95" y="0" width="32" height="28" rx="4"/><text class="gene" x="111" y="19" text-anchor="middle">0</text>
