</g>

<text class="head" x="455" y="248">しくみ</text>
<text class="cap" x="455" y="268">・区間（窓）をランダムに選ぶ。</text>
<text class="cap" x="455" y="286">・窓内の親1の要素はそのまま使い、共通要素の</text>
<text class="cap" x="455" y="304">　並びだけを相手（親2）の順序に合わせ直す。</text>
<text class="cap" x="455" y="322">・はみ出した要素は窓の末尾へ詰める。</text>
<rect class="ok-bg" x="455" y="338" width="372" height="26" rx="6"/>
<text class="ok-tx" x="467" y="356">✓ 各親の本数を保存＝常に実行可能。この符号化に適合（既定値）</text>

<line class="div" x1="32" y1="400" x2="868" y2="400"/>

<!-- ===== PMX ===== -->
<text class="sec" x="32" y="426">② PMX 交叉 — 部分写像交叉</text>

<g transform="translate(0,442)">
  <rect class="win" x="166" y="-3" width="149" height="34" rx="5"/>
  <rect class="amb" x="93" y="-2" width="36" height="32" rx="5"/>
  <rect class="amb" x="204" y="-2" width="36" height="32" rx="5"/>
  <rect class="amb" x="315" y="-2" width="36" height="32" rx="5"/>
  <rect class="j0" x="95" y="0" width="32" height="28" rx="4"/><text class="gene" x="111" y="19" text-anchor="middle">0</text>
  <rect class="j1" x="132" y="0" width="32" height="28" rx="4"/><text class="gene" x="148" y="19" text-anchor="middle">1</text>
  <rect class="j2" x="169" y="0" width="32" height="28" rx="4"/><text class="gene" x="185" y="19" text-anchor="middle">2</text>
  <rect class="j0" x="206" y="0" width="32" height="28" rx="4"/><text class="gene" x="222" y="19" text-anchor="middle">0</text>
  <rect class="j1" x="243" y="0" width="32" height="28" rx="4"/><text class="gene" x="259" y="19" text-anchor="middle">1</text>
  <rect class="j2" x="280" y="0" width="32" height="28" rx="4"/><text class="gene" x="296" y="19" text-anchor="middle">2</text>
  <rect class="j0" x="317" y="0" width="32" height="28" rx="4"/><text class="gene" x="333" y="19" text-anchor="middle">0</text>
  <rect class="j1" x="354" y="0" width="32" height="28" rx="4"/><text class="gene" x="370" y="19" text-anchor="middle">1</text>
  <rect class="j2" x="391" y="0" width="32" height="28" rx="4"/><text class="gene" x="407" y="19" text-anchor="middle">2</text>
  <text class="rl" x="86" y="19" text-anchor="end">親1</text>
  <text class="q" x="111" y="-8" text-anchor="middle">?</text>
  <text class="q" x="222" y="-8" text-anchor="middle">?</text>
  <text class="q" x="333" y="-8" text-anchor="middle">?</text>
</g>
<g transform="translate(0,490)">
  <rect class="win" x="166" y="-3" width="149" height="34" rx="5"/>
  <rect class="j2" x="95" y="0" width="32" height="28" rx="4"/><text class="gene" x="111" y="19" text-anchor="middle">2</text>
  <rect class="j1" x="132" y="0" width="32" height="28" rx="4"/><text class="gene" x="148" y="19" text-anchor="middle">1</text>
  <rect class="j0" x="169" y="0" width="32" height="28" rx="4"/><text class="gene" x="185" y="19" text-anchor="middle">0</text>
  <rect class="j2" x="206" y="0" width="32" height="28" rx="4"/><text class="gene" x="222" y="19" text-anchor="middle">2</text>
  <rect class="j1" x="243" y="0" width="32" height="28" rx="4"/><text class="gene" x="259" y="19" text-anchor="middle">1</text>
  <rect class="j0" x="280" y="0" width="32" height="28" rx="4"/><text class="gene" x="296" y="19" text-anchor="middle">0</text>
  <rect class="j2" x="317" y="0" width="32" height="28" rx="4"/><text class="gene" x="333" y="19" text-anchor="middle">2</text>
  <rect class="j1" x="354" y="0" width="32" height="28" rx="4"/><text class="gene" x="370" y="19" text-anchor="middle">1</text>
  <rect class="j0" x="391" y="0" width="32" height="28" rx="4"/><text class="gene" x="407" y="19" text-anchor="middle">0</text>
  <text class="rl" x="86" y="19" text-anchor="end">親2</text>
</g>
<text class="brl" x="170" y="540">窓の位置2：親1の「2」を親2の「0」に合わせたい → 親1の「0」は3つ。どれと交換？</text>

<text class="head" x="455" y="458">しくみ</text>
<text class="cap" x="455" y="478">・窓内で位置ごとの値が一致するよう、各親の</text>
<text class="cap" x="455" y="496">　“内部”でスワップして値を交換する。</text>
<text class="cap" x="455" y="514">・だが同じジョブ番号が複数あるため「どの同番号</text>
<text class="cap" x="455" y="532">　と対応づけるか」が一意に定まらない（乱択）。</text>
<text class="cap" x="455" y="550">　＝ PMX 本来の前提（全要素が相異なる）が崩れる。</text>
<rect class="wn-bg" x="455" y="566" width="372" height="26" rx="6"/>
<text class="wn-tx" x="467" y="584">⚠ ブロック継承が機能せず、ほぼランダムなスワップに退化</text>

<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
    <path d="M1 1 L4 6 L7 1" fill="none" stroke="#73726c" stroke-width="1.4"/>
  </marker>
</defs>
</svg>
