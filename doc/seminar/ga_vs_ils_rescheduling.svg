<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 450" role="img">
<title>再スケジューリングにおけるGAとILSの探索挙動の対比</title>
<desc>GAは交叉により広域探索する一方、ILSは初期スケジュールの近傍を集中的に探索する</desc>
<style>
  .panel-bg { fill: #f8f7f4; }
  .cn { stroke: rgba(0,0,0,0.04); stroke-width: 9; }
  .cs { stroke: rgba(0,0,0,0.09); stroke-width: 9; }
  .panel-border { fill: none; stroke: rgba(0,0,0,0.08); stroke-width: 0.5; }
  .ptitle { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .lbl { font-family: sans-serif; font-size: 11px; fill: #73726c; }
  .legend-text { font-family: sans-serif; font-size: 11px; fill: #73726c; }
  .xline { stroke: rgba(127,119,221,0.22); stroke-width: 1; }
  .kid { fill: rgba(127,119,221,0.75); }
  @media (prefers-color-scheme: dark) {
    .panel-bg { fill: #1a1a18; }
    .cn { stroke: rgba(255,255,255,0.04); }
    .cs { stroke: rgba(255,255,255,0.09); }
    .panel-border { stroke: rgba(255,255,255,0.1); }
    .ptitle { fill: #c2c0b6; }
    .lbl { fill: #9c9a92; }
    .legend-text { fill: #9c9a92; }
    .xline { stroke: rgba(175,169,236,0.22); }
    .kid { fill: rgba(175,169,236,0.75); }
  }
</style>

<text x="200.00" y="20" class="ptitle" text-anchor="middle">GA（遺伝的アルゴリズム）</text>
<text x="620.00" y="20" class="ptitle" text-anchor="middle">ILS（反復局所探索）</text>

